[project]
name = "vaillant-eebus"
version = "0.5.3"
description = "Backend of the Vaillant EEBUS Home Assistant app"
requires-python = ">=3.13,<3.14"
# Dependencies are pinned with hashes in backend/requirements*.lock.

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["backend/gen", "bridge"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["vaillant_eebus", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["backend/src", "backend/gen"]
files = ["backend/src", "backend/scripts", "tests"]

[[tool.mypy.overrides]]
# Generated by mypy-protobuf from the bridge's proto files; not hand-maintained.
module = ["eebus.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# grpcio-tools ships no type information; only used by generate_proto.py.
module = ["grpc_tools", "grpc_tools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["backend/src", "backend/gen"]
