name: Vaillant EEBUS
version: "0.2.0"
slug: vaillant_eebus
description: Vaillant-Wärmepumpe lokal über EEBUS – ohne Cloud und ohne eBUS-Adapter.
url: https://github.com/wattarosolar-lgtm/vaillant-eebus
# Pre-built multi-arch image from GitHub Actions. The Supervisor never builds
# this app itself: the Dockerfile needs the repository root as build context.
image: ghcr.io/wattarosolar-lgtm/vaillant-eebus
arch:
  - amd64
  - aarch64
# s6-overlay from the base image is PID 1.
init: false
startup: services
# Required: EEBUS discovery uses mDNS, and the gateway connects to port 4712.
host_network: true
# The UI behind the Home Assistant login. With host networking this port is
# opened on the host; the backend binds it to the hassio network address only.
# Keep in sync with HTTP_PORT in rootfs/etc/s6-overlay/s6-rc.d/backend/run.
ingress: true
ingress_port: 8714
# Whether the panel appears in the sidebar is the user's choice ("Show in
# sidebar" on the app page); the app config cannot preset it.
panel_title: Wärmepumpe
panel_icon: mdi:heat-pump
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
